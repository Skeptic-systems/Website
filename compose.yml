services:
  postgres:
    image: postgres
    restart: unless-stopped
    container_name: turborepo_postgres_website
    env_file:
      - .env
    shm_size: 128mb
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-turborepo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456789}
      POSTGRES_DB: ${POSTGRES_DB:-turborepo}
    volumes:
      - database:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: turborepo_redis_website
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --appendonly yes
    ports:
      - "6380:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/dockerfile
    restart: unless-stopped
    container_name: turborepo_api_website
    depends_on:
      - postgres
      - redis
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - DATABASE_URL=${DATABASE_URL_INTERNAL:-postgresql://turborepo:123456789@postgres:5432/turborepo}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REFRESH_TOKEN=${SPOTIFY_REFRESH_TOKEN}
      - DISCORD_USER_ID=${DISCORD_USER_ID}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_USERNAME=${GITHUB_USERNAME}
      - PTERODACTYL_API_URL=${PTERODACTYL_API_URL}
      - PTERODACTYL_API_KEY=${PTERODACTYL_API_KEY}
      - PTERODACTYL_SITE_IDENTIFIER=${PTERODACTYL_SITE_IDENTIFIER:-}
      - JELLYFIN_BASE_URL=${JELLYFIN_BASE_URL}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - REDIS_HOST=${REDIS_HOST_INTERNAL:-redis}
      - REDIS_PORT=${REDIS_PORT_INTERNAL:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password}
      - TERMINAL_SESSION_COOKIE_NAME=${TERMINAL_SESSION_COOKIE_NAME}
      - TERMINAL_SESSION_TTL_SECONDS=${TERMINAL_SESSION_TTL_SECONDS}
      - TERMINAL_SESSION_TEXT_LIMIT=${TERMINAL_SESSION_TEXT_LIMIT}
  www:
    build:
      context: .
      dockerfile: apps/www/dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_INTERNAL_API_URL: ${NEXT_INTERNAL_API_URL:-http://api:3001}
    restart: unless-stopped
    container_name: turborepo_www_website
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_INTERNAL_API_URL=${NEXT_INTERNAL_API_URL:-http://api:3001}


volumes:
  database:
    driver: local
  redis_data:
    driver: local